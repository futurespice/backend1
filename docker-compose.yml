services:
  db:
    image: postgres:15-alpine
    container_name: baiel_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baielapp_2}
      POSTGRES_USER: ${POSTGRES_USER:-baiel_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-12345678}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    networks:
      - baiel_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baiel_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: baiel_redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - baiel_network
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    container_name: baiel_web
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - ./staticfiles:/app/staticfiles
      - ./media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - baiel_network

  celery:
    build: .
    container_name: baiel_celery
    command: celery -A config worker -l info
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - baiel_network

  celery-beat:
    build: .
    container_name: baiel_celery_beat
    command: celery -A config beat -l info --scheduler django_celery_beat.schedulers:DatabaseScheduler
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    restart: unless-stopped
    networks:
      - baiel_network

volumes:
  postgres_data:
  redis_data:

networks:
  baiel_network:
    driver: bridge
